services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "${APP_PORT:-80}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - JUDGE0_URL=${JUDGE0_URL:-https://ce.judge0.com}
      - JUDGE0_KEY=${JUDGE0_KEY:-}
      - JUDGE0_HOST=${JUDGE0_HOST:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
